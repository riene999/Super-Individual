[project]
name = "super-individual-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "openai>=1.0.0",
  "super-individual-orchestrator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
super-individual-orchestrator = { path = "../../packages/orchestrator", editable = true }
